<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090d1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AWS Dojo — CLF-C02</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ══════════════ HOME SCREEN ══════════════ -->
<div id="home-screen" class="screen active">

  <header class="home-header">
    <div class="home-top">
      <div class="brand">
        <div class="brand-logo">☁</div>
        <div>
          <div class="brand-name">AWS Dojo</div>
          <div class="brand-sub">CLF-C02 Prep</div>
        </div>
      </div>
      <div class="streak-badge" id="streak-badge">🔥 0 giorni</div>
    </div>

    <div class="level-row">
      <div class="level-emoji" id="level-emoji">☁️</div>
      <div class="level-info">
        <div class="level-name" id="level-name">Cloud Curious</div>
        <div class="level-xp"  id="level-xp">0 / 100 XP</div>
      </div>
    </div>

    <div class="xp-bar">
      <div class="xp-fill" id="xp-fill" style="width:0%"></div>
    </div>
  </header>

  <div class="modules-grid" id="modules-grid"></div>

  <div class="section-title">Allenamento</div>
  <div class="train-section">
    <div class="exam-banner" id="exam-banner" onclick="startExamIntro()">
      <div class="exam-banner-left">
        <div class="exam-banner-icon">🎯</div>
        <div>
          <div class="exam-banner-title">Simulatore Esame CLF-C02</div>
          <div class="exam-banner-sub" id="exam-sub">65 domande · 90 minuti · soglia 700/1000</div>
        </div>
      </div>
      <div class="exam-banner-arrow">→</div>
    </div>

    <div class="train-grid">
      <button class="train-tile" onclick="startErrorsSetup()">
        <span class="train-badge" id="errors-badge">0</span>
        <span class="train-icon">🔁</span>
        <span class="train-title">Ripasso errori</span>
        <span class="train-sub" id="errors-sub">Nessun errore 🎉</span>
      </button>
      <button class="train-tile" onclick="startQuickSetup()">
        <span class="train-icon">⚡</span>
        <span class="train-title">Allenamento rapido</span>
        <span class="train-sub">Per argomento, con spiegazioni</span>
      </button>
    </div>

    <div class="stats-row" id="stats-row"></div>
  </div>

</div>

<!-- ══════════════ FEED SCREEN ══════════════ -->
<div id="feed-screen" class="screen">

  <div class="feed-header">
    <button class="feed-back" onclick="showScreen('home-screen'); renderHome()">←</button>
    <div class="feed-title" id="feed-title">Modulo</div>
    <div class="feed-prog"  id="feed-prog"></div>
  </div>

  <div class="feed-progress-bar">
    <div class="feed-progress-fill" id="feed-progress-fill" style="width:0%"></div>
  </div>

  <div class="feed-viewport" id="feed-viewport"></div>

</div>

<!-- ══════════════ EXAM SCREEN ══════════════ -->
<div id="exam-screen" class="screen">

  <div class="feed-header">
    <button class="feed-back" id="exam-back-btn" onclick="confirmExitExam()">←</button>
    <div class="feed-title">🎯 Simulatore CLF-C02</div>
    <div class="exam-timer" id="exam-timer">90:00</div>
  </div>

  <div class="feed-progress-bar">
    <div class="feed-progress-fill" id="exam-progress-fill" style="width:0%"></div>
  </div>

  <div class="exam-viewport" id="exam-viewport"></div>

</div>

<!-- ══════════════ PRACTICE SCREEN ══════════════ -->
<div id="practice-screen" class="screen">

  <div class="feed-header">
    <button class="feed-back" onclick="exitPractice()">←</button>
    <div class="feed-title" id="practice-title">Allenamento</div>
    <div class="feed-prog" id="practice-prog"></div>
  </div>

  <div class="feed-progress-bar">
    <div class="feed-progress-fill" id="practice-progress-fill" style="width:0%"></div>
  </div>

  <div class="exam-viewport" id="practice-viewport"></div>

</div>

<!-- ══════════════ EXAM RESULTS SCREEN ══════════════ -->
<div id="exam-results-screen" class="screen">

  <div class="feed-header">
    <button class="feed-back" onclick="goHome()">←</button>
    <div class="feed-title">📊 Risultati</div>
    <div></div>
  </div>

  <div class="exam-results-body" id="exam-results-body"></div>

</div>

<!-- ══════════════ TOAST ══════════════ -->
<div id="toast"></div>

<!-- ══════════════ CONFETTI ══════════════ -->
<canvas id="confetti-canvas"></canvas>

<!-- ══════════════ LEVEL-UP OVERLAY ══════════════ -->
<div id="levelup-overlay">
  <div class="levelup-emoji">🌟</div>
  <div class="levelup-title">Nuovo livello!</div>
  <div class="levelup-name"></div>
  <button class="levelup-btn" onclick="closeLevelUp()">Vai avanti 🚀</button>
</div>

<!-- ══════════════ SCRIPTS ══════════════ -->
<!-- 1. Quiz bank (domande d'esame uniche, con spiegazioni) -->
<script src="js/data/quiz_bank.js"></script>

<!-- 2. Moduli di lezione (contenuto) -->
<script src="js/data/module01.js"></script>
<script src="js/data/module02.js"></script>
<script src="js/data/module03.js"></script>
<script src="js/data/module04.js"></script>
<script src="js/data/module05.js"></script>
<script src="js/data/module06.js"></script>
<script src="js/data/module07.js"></script>
<script src="js/data/module08.js"></script>
<script src="js/data/module09.js"></script>
<script src="js/data/module10.js"></script>
<script src="js/data/module11.js"></script>
<script src="js/data/module12.js"></script>
<script src="js/data/module13.js"></script>
<script src="js/data/module14.js"></script>
<script src="js/data/module15.js"></script>
<script src="js/data/module16.js"></script>
<script src="js/data/module17.js"></script>
<script src="js/data/module18.js"></script>

<!-- 3. Definizione moduli (usa le costanti sopra) -->
<script src="js/modules.js"></script>

<!-- 4. Motore app -->
<script src="js/app.js"></script>
<script src="js/training.js"></script>

</body>
</html>
