<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090d1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AWS Dojo — CLF-C02</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ══════════════ HOME SCREEN ══════════════ -->
<div id="home-screen" class="screen active">

  <header class="home-header">
    <div class="home-top">
      <div class="brand">
        <div class="brand-logo">☁</div>
        <div>
          <div class="brand-name">AWS Dojo</div>
          <div class="brand-sub">CLF-C02 Prep</div>
        </div>
      </div>
      <div class="streak-badge" id="streak-badge">🔥 0 giorni</div>
    </div>

    <div class="level-row">
      <div class="level-emoji" id="level-emoji">☁️</div>
      <div class="level-info">
        <div class="level-name" id="level-name">Cloud Curious</div>
        <div class="level-xp"  id="level-xp">0 / 100 XP</div>
      </div>
    </div>

    <div class="xp-bar">
      <div class="xp-fill" id="xp-fill" style="width:0%"></div>
    </div>
  </header>

  <div class="modules-grid" id="modules-grid"></div>

</div>

<!-- ══════════════ FEED SCREEN ══════════════ -->
<div id="feed-screen" class="screen">

  <div class="feed-header">
    <button class="feed-back" onclick="showScreen('home-screen'); renderHome()">←</button>
    <div class="feed-title" id="feed-title">Modulo</div>
    <div class="feed-prog"  id="feed-prog"></div>
  </div>

  <div class="feed-progress-bar">
    <div class="feed-progress-fill" id="feed-progress-fill" style="width:0%"></div>
  </div>

  <div class="feed-viewport" id="feed-viewport"></div>

</div>

<!-- ══════════════ TOAST ══════════════ -->
<div id="toast"></div>

<!-- ══════════════ CONFETTI ══════════════ -->
<canvas id="confetti-canvas"></canvas>

<!-- ══════════════ LEVEL-UP OVERLAY ══════════════ -->
<div id="levelup-overlay">
  <div class="levelup-emoji">🌟</div>
  <div class="levelup-title">Nuovo livello!</div>
  <div class="levelup-name"></div>
  <button class="levelup-btn" onclick="closeLevelUp()">Vai avanti 🚀</button>
</div>

<!-- ══════════════ SCRIPTS ══════════════ -->
<!-- 1. Quiz bank (1142 domande esame) -->
<script src="js/data/quiz_bank.js"></script>

<!-- 2. Moduli di lezione (contenuto) -->
<script src="js/data/module01.js"></script>
<script src="js/data/module02.js"></script>
<script src="js/data/module03.js"></script>
<script src="js/data/module04.js"></script>
<script src="js/data/module05.js"></script>
<script src="js/data/module06.js"></script>
<script src="js/data/module07.js"></script>
<script src="js/data/module08.js"></script>
<script src="js/data/module09.js"></script>
<script src="js/data/module10.js"></script>
<script src="js/data/module11.js"></script>
<script src="js/data/module12.js"></script>

<!-- 3. Definizione moduli (usa le costanti sopra) -->
<script src="js/modules.js"></script>

<!-- 4. Motore app -->
<script src="js/app.js"></script>

</body>
</html>
